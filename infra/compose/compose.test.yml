# Test overlay: disposable Postgres and object storage on tmpfs, the demo seed,
# and a backend test runner. Used by `make test` / `make test-db` and CI.

name: pickwise-test

x-backend-dev: &backend-dev
  context: .
  dockerfile: infra/docker/backend.Dockerfile
  target: dev

services:
  postgres:
    tmpfs:
      - /var/lib/postgresql:size=1g
    volumes: !override
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./db/bootstrap:/pickwise/bootstrap:ro

  migrate:
    build: *backend-dev
    image: pickwise-backend:dev
    environment:
      PICKWISE_ENV: test

  seed-demo:
    build: *backend-dev
    image: pickwise-backend:dev
    command: ["pickwise", "demo", "seed"]
    environment:
      PICKWISE_ENV: test
      DATABASE_HOST: postgres
      DATABASE_NAME: pickwise
      DATABASE_USER: pickwise_maint
      DATABASE_PASSWORD: ${PG_MAINT_PASSWORD}
      PICKWISE_KEK: ${PICKWISE_KEK}
      SESSION_SECRET: ${SESSION_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  s3:
    tmpfs:
      - /data:size=256m
    environment:
      # Every bucket is a collection with its own volume; small volumes let the
      # quarantine and files buckets both fit on the 256 MB tmpfs (CopyObject needs both).
      S3_VOLUME_SIZE_LIMIT_MB: "16"
    volumes: !override
      - ./infra/docker/s3/seaweedfs-entrypoint.sh:/pickwise/seaweedfs-entrypoint.sh:ro

  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-test:
    build: *backend-dev
    image: pickwise-backend:dev
    profiles: ["test"]
    command: ["pytest"]
    environment:
      PICKWISE_ENV: test
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: pickwise
      DATABASE_USER: pickwise_api
      DATABASE_PASSWORD: ${PG_API_PASSWORD}
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD}
      PG_API_PASSWORD: ${PG_API_PASSWORD}
      PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD}
      PG_MAINT_PASSWORD: ${PG_MAINT_PASSWORD}
      S3_ENDPOINT_URL: http://s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_FILES: ${S3_BUCKET_FILES:-pickwise-files}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-pickwise-quarantine}
      SCANNER: stub
      # Only used by `make scan-check`, which starts clamd (profile "full").
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      PICKWISE_KEK: ${PICKWISE_KEK}
      SESSION_SECRET: ${SESSION_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      PUBLIC_BASE_URL: http://localhost:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAILPIT_URL: http://mailpit:8025
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    volumes:
      - ./apps/backend:/app/apps/backend:ro
      - ./db:/app/db:ro
    depends_on:
      seed-demo:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
