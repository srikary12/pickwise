# SPDX-License-Identifier: AGPL-3.0-only
# Base stack shared by dev, test and prod. Always used with an overlay:
#   docker compose --project-directory . -f infra/compose/compose.yml -f infra/compose/compose.<env>.yml
# Paths are relative to the repository root (the project directory).
# Every image is pinned by exact tag and digest; never use :latest.

name: pickwise

x-backend-build: &backend-build
  context: .
  dockerfile: infra/docker/backend.Dockerfile

x-db-env: &db-env
  PICKWISE_ENV: ${PICKWISE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: pickwise

x-s3-env: &s3-env
  S3_ENDPOINT_URL: http://s3:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?run make dev to generate .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?run make dev to generate .env}
  S3_BUCKET_FILES: ${S3_BUCKET_FILES:-pickwise-files}
  S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-pickwise-quarantine}

x-app-env: &app-env
  SCANNER: ${SCANNER:-stub}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  PICKWISE_KEK: ${PICKWISE_KEK:?run make dev to generate .env}
  SESSION_SECRET: ${SESSION_SECRET:?run make dev to generate .env}
  JEV_MODEL: ${JEV_MODEL:-jev-1.13.0}

services:
  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: pickwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make dev to generate .env}
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD:?run make dev to generate .env}
      PG_API_PASSWORD: ${PG_API_PASSWORD:?run make dev to generate .env}
      PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD:?run make dev to generate .env}
      PG_MAINT_PASSWORD: ${PG_MAINT_PASSWORD:?run make dev to generate .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./db/bootstrap:/pickwise/bootstrap:ro
    healthcheck:
      # TCP, not the socket: the temporary server used during initdb listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "pickwise"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  migrate:
    build: *backend-build
    command: ["pickwise", "db", "migrate"]
    environment:
      <<: *db-env
      DATABASE_USER: pickwise_migrator
      DATABASE_PASSWORD: ${PG_MIGRATOR_PASSWORD}
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD}
      PG_API_PASSWORD: ${PG_API_PASSWORD}
      PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD}
      PG_MAINT_PASSWORD: ${PG_MAINT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  s3:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    entrypoint: ["/bin/sh", "/pickwise/seaweedfs-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - s3data:/data
      - ./infra/docker/s3/seaweedfs-entrypoint.sh:/pickwise/seaweedfs-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  s3-init:
    build:
      context: .
      dockerfile: infra/docker/tools.Dockerfile
    image: pickwise-tools:local
    entrypoint: ["/bin/sh", "/pickwise/init.sh"]
    environment:
      <<: *s3-env
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    volumes:
      - ./infra/docker/s3/init.sh:/pickwise/init.sh:ro
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578
    profiles: ["full"]
    volumes:
      # A path (CI cache) or the named volume.
      - ${CLAMAV_DB_PATH:-clamav-db}:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 6
      # First start downloads ~300 MB of signatures.
      start_period: 15m
    restart: unless-stopped

  api:
    build: *backend-build
    environment:
      <<: [*db-env, *s3-env, *app-env]
      DATABASE_USER: pickwise_api
      DATABASE_PASSWORD: ${PG_API_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      # Probe fast while starting, then every 30s so probes don't flood the logs.
      interval: 30s
      start_interval: 2s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    build: *backend-build
    command: ["python", "-m", "pickwise.worker"]
    environment:
      <<: [*db-env, *s3-env, *app-env]
      DATABASE_USER: pickwise_worker
      DATABASE_PASSWORD: ${PG_WORKER_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "pickwise", "worker", "health"]
      interval: 30s
      start_interval: 3s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      PICKWISE_API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/healthz").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      start_interval: 3s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # Runs make targets that would otherwise need host tooling. Never started by `up`.
  tools:
    build:
      context: .
      dockerfile: infra/docker/tools.Dockerfile
    image: pickwise-tools:local
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: [*db-env, *s3-env]
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD:-}
    volumes:
      - .:/repo
    working_dir: /repo

volumes:
  pgdata:
  s3data:
  clamav-db:
