# CLA Assistant Lite: contributors accept .github/CLA.md by commenting on their
# pull request. Signatures are stored on the `cla-signatures` branch of this repo.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # The owner doesn't sign their own CLA: skip the job for their activity.
    if: |
      github.actor != 'srikary12' &&
      ((github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target')
    runs-on: ubuntu-24.04
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/.github/CLA.md
          branch: cla-signatures
          allowlist: srikary12,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, please read the
            [Individual Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/.github/CLA.md)
            and sign it by posting the comment below. If you contribute on behalf of an
            employer, please also see the [Corporate CLA](https://github.com/${{ github.repository }}/blob/main/.github/CCLA.md).
