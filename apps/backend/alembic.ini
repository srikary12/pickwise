# Alembic configuration. Migrations live at the repo root in db/migrations.
# The connection is built in env.py from environment variables (as pickwise_migrator).

[alembic]
script_location = %(here)s/../../db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
path_separator = os

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
