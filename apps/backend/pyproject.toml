[project]
name = "pickwise"
version = "0.0.0"
description = "Pickwise: open-source multi-tenant HRMS for Indian companies"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    # Pinned exactly: Alembic revision 0000 vendors this version's schema SQL.
    "procrastinate==3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "structlog>=26.1.0",
    "aioboto3>=15.5.0",
    "typer>=0.27.2",
]

[project.scripts]
pickwise = "pickwise.cli.main:app"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pickwise"]

[tool.uv]
required-version = ">=0.12"

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "../../db"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "ASYNC", "PT", "TID", "N"]
ignore = ["S101"]  # assert is fine in tests; production code uses explicit raises

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"../../db/tests/**" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["pickwise"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --- mypy -------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests", "../../db/tests", "../../db/migrations"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["aioboto3", "aioboto3.*", "botocore", "botocore.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "../../db/tests"]
markers = [
    "db: needs the test Postgres (compose.test.yml)",
    "s3: needs the test object storage (compose.test.yml)",
]
addopts = "-ra --strict-markers"

# --- import-linter ----------------------------------------------------------
# api/, worker/ and cli/ are composition roots: they sit outside the layers and
# nothing may import them.
[tool.importlinter]
root_package = "pickwise"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Module dependency direction"
type = "layers"
layers = [
    "pickwise.recruit",
    "pickwise.payroll",
    "pickwise.attendance",
    "pickwise.leave",
    "pickwise.core",
    "pickwise.platform",
    "pickwise.shared",
]

[[tool.importlinter.contracts]]
name = "ai depends only on platform and shared"
type = "forbidden"
source_modules = ["pickwise.ai"]
forbidden_modules = [
    "pickwise.core",
    "pickwise.leave",
    "pickwise.attendance",
    "pickwise.payroll",
    "pickwise.recruit",
]

[[tool.importlinter.contracts]]
name = "Only recruit uses ai"
type = "forbidden"
source_modules = [
    "pickwise.shared",
    "pickwise.platform",
    "pickwise.core",
    "pickwise.leave",
    "pickwise.attendance",
    "pickwise.payroll",
]
forbidden_modules = ["pickwise.ai"]

[[tool.importlinter.contracts]]
name = "payroll.engine is pure"
type = "forbidden"
source_modules = ["pickwise.payroll.engine"]
forbidden_modules = [
    "pickwise.platform",
    "pickwise.core",
    "pickwise.leave",
    "pickwise.attendance",
    "pickwise.recruit",
    "pickwise.ai",
    "pickwise.api",
    "pickwise.worker",
    "pickwise.cli",
    "pickwise.shared.db",
    "pickwise.shared.settings",
    "pickwise.shared.logging",
    "sqlalchemy",
    "asyncpg",
    "psycopg",
    "procrastinate",
    "fastapi",
    "aioboto3",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Nothing imports the composition roots"
type = "forbidden"
source_modules = [
    "pickwise.shared",
    "pickwise.platform",
    "pickwise.core",
    "pickwise.leave",
    "pickwise.attendance",
    "pickwise.payroll",
    "pickwise.recruit",
    "pickwise.ai",
]
forbidden_modules = ["pickwise.api", "pickwise.worker", "pickwise.cli"]
