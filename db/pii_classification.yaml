# PII classification: the single source of truth (CLAUDE.md rule 13, ADR 0005).
#
# Levels: public | internal | confidential | restricted. Columns not listed are internal.
#   confidential: personal or sensitive data, permission-gated, redacted in audit diffs
#   restricted:   secrets and identity numbers, encrypted or hashed at the application level
#   public:       intentionally published (listed so reviews see it was a decision)
#
# Migrations turn every confidential/restricted entry into a column comment
# ('@pii confidential' / '@pii restricted') for tables that exist. A test diffs this
# file against the database in both directions, and `make docs-pii` renders it into
# docs/DATA_MODEL.md. Entries for tables that later phases create are checked once
# those tables exist.
#
# Format: "<schema>.<table>": { <column>: <level> }

version: 1

